<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; color: #333; }
        .header { background: #f8f9fa; padding: 20px; text-align: center; border-bottom: 2px solid #fd7e14; }
        .content { padding: 20px; }
        .product-info { border: 1px solid #ddd; padding: 15px; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="header"><h2>New Arrival!</h2></div>
    <div class="content">
        <p>Hi {{customerName}},</p>
        <p>We're excited to announce a new addition to our store!</p>
        <div class="product-info">
            <h3>{{productName}}</h3>
            <p>{{description}}</p>
        </div>
        <p>Check it out in the Ali Grandson Spare Parts app today!</p>
    </div>
</body>
</html>
