<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; color: #333; }
        .header { background: #f8f9fa; padding: 20px; text-align: center; border-bottom: 2px solid #6c757d; }
        .content { padding: 20px; }
    </style>
</head>
<body>
    <div class="header"><h2>Order Cancelled</h2></div>
    <div class="content">
        <p>Hi {{customerName}},</p>
        <p>We're sorry to inform you that your order <strong>#{{orderId}}</strong> has been cancelled.</p>
        <p>If you have any questions or if this was done in error, please contact our support team.</p>
        <p>We hope to see you again soon.</p>
    </div>
</body>
</html>
