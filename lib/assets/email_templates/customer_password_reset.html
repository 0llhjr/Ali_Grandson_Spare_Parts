<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; color: #333; }
        .header { background: #f8f9fa; padding: 20px; text-align: center; border-bottom: 2px solid #6f42c1; }
        .content { padding: 20px; }
        .password-box { background: #e9ecef; padding: 15px; border-radius: 5px; text-align: center; font-size: 1.2em; font-family: monospace; font-weight: bold; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="header"><h2>Password Reset</h2></div>
    <div class="content">
        <p>Hi {{customerName}},</p>
        <p>Your account password has been reset by the administrator.</p>
        <p>Your new temporary password is:</p>
        <div class="password-box">{{newPassword}}</div>
        <p>Please log in and change your password as soon as possible for security reasons.</p>
        <p>Thank you for choosing Ali Grandson Spare Parts!</p>
    </div>
</body>
</html>
