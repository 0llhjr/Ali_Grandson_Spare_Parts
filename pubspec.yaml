name: alis_grandson_app
description: "Spare Parts App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  image: ^4.2.0
  fl_chart: ^0.66.0
  csv: ^6.0.0
  intl: ^0.19.0
  share_plus: ^10.1.3
  open_filex: ^4.5.0
  cross_file: ^0.3.4+2
  http: ^1.1.0
  flutter_dotenv: ^5.1.0
  flutter_markdown_plus: ^1.0.7

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "lib/assets/Imgs/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - lib/assets/Imgs/app_icon.png
    - lib/assets/Imgs/logo.png
    - lib/assets/Product_Data/
    - lib/assets/Banner_Imgs/
    - lib/assets/email_templates/
